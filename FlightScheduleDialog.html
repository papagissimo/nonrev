<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: Arial, sans-serif; font-size: 13px; margin: 10px; }
    .pickerRow { display: flex; gap: 10px; align-items: flex-end; margin-bottom: 8px; flex-wrap: wrap; }
    .pickerField label { display: block; font-size: 11px; color: #888; margin-bottom: 2px; }
    .pickerField input, .pickerField select { font-size: 13px; padding: 4px; }
    #orgInput, #destInput { width: 60px; text-transform: lowercase; text-align: center; }
    #swapBtn { background: none; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; font-size: 14px; padding: 5px 8px; align-self: flex-end; margin-bottom: 1px; }
    #swapBtn:hover { background: #f1f1f1; }
    #loadBtn { background: #1a73e8; color: white; border: none; border-radius: 4px; padding: 6px 14px; cursor: pointer; }
    #loadBtn:disabled { background: #a9c6f2; }
    .durationRow { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; color: #666; }
    #durationInput { width: 50px; text-align: center; font-size: 12px; padding: 3px; }
    .ofCell { font-size: 11px; color: #555; line-height: 1.35; }
    table { border-collapse: collapse; width: 100%; table-layout: fixed; margin-top: 6px; }
    th { text-align: left; font-size: 11px; color: #888; padding: 2px 4px; }
    td { padding: 3px 4px; vertical-align: middle; }
    input.car { font-size: 12px; color: #666; width: 100%; box-sizing: border-box; text-transform: lowercase; }
    input.dep { font-weight: bold; font-size: 14px; width: 100%; box-sizing: border-box; }
    input.flt { font-size: 12px; color: #666; width: 100%; box-sizing: border-box; }
    select.airc { font-size: 12px; width: 100%; box-sizing: border-box; }
    .acLine { font-size: 11px; color: #666; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .acLink { color: #1a73e8; cursor: pointer; margin-left: 6px; }
    .aircraftForm { border: 1px solid #ddd; border-radius: 4px; padding: 6px 8px; margin: 2px 0 6px; background: #fff; font-size: 12px; }
    .aircraftForm input { font-size: 13px; margin-right: 6px; }
    .aircraftForm input.afSize { width: 40px; text-align: center; }
    .afStatus { color: #c5221f; margin-left: 8px; }
    .delBtn { cursor: pointer; color: #888; font-size: 14px; background: none; border: none; }
    .delBtn:hover { color: #c5221f; }
    #addBtn { margin-top: 8px; font-size: 12px; background: none; border: 1px solid #ccc; border-radius: 4px; padding: 5px 10px; cursor: pointer; }
    .btnRow { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; border-top: 1px solid #eee; padding-top: 10px; }
    #status { color: #666; font-size: 12px; }
    #saveBtn { background: #1a73e8; color: white; border: none; border-radius: 4px; padding: 8px 16px; cursor: pointer; }
    #saveBtn:disabled { background: #a9c6f2; }
    #copyBtn { background: none; border: 1px solid #ccc; border-radius: 4px; padding: 8px 12px; cursor: pointer; margin-right: 6px; font-size: 12px; color: #444; }
    #copyBtn:disabled { color: #aaa; }
    #emptyMsg { color: #888; font-size: 12px; margin: 10px 0; display: none; }
  </style>
</head>
<body>
  <div class="pickerRow">
    <div class="pickerField">
      <label for="orgInput">from</label>
      <input type="text" id="orgInput" placeholder="slc">
    </div>
    <button id="swapBtn" onclick="swapOrgDest()" title="swap origin/destination">&#8646;</button>
    <div class="pickerField">
      <label for="destInput">to</label>
      <input type="text" id="destInput" placeholder="lax">
    </div>
    <div class="pickerField">
      <label for="dowSelect">day</label>
      <div style="display:flex; gap:2px;">
        <button id="prevDayBtn" onclick="shiftDay(-1)" title="previous day" style="padding:4px 7px; cursor:pointer;">&#8592;</button>
        <select id="dowSelect"></select>
        <button id="nextDayBtn" onclick="shiftDay(1)" title="next day" style="padding:4px 7px; cursor:pointer;">&#8594;</button>
      </div>
    </div>
    <button id="loadBtn" onclick="loadSchedule()">Load</button>
  </div>

  <div class="durationRow" id="durationRow" style="display:none;">
    <label for="durationInput" style="margin:0;">flight time (hhmm, route-wide)</label>
    <input type="text" id="durationInput" placeholder="0215">
  </div>


  <div id="emptyMsg">No flights logged for this route/day yet - add one below.</div>

  <table id="schedTable" style="display:none;">
    <colgroup>
      <col style="width:44px;">
      <col style="width:90px;">
      <col style="width:100px;">
      <col style="width:200px;">
      <col style="width:78px;">
      <col style="width:28px;">
      <col style="width:28px;">
    </colgroup>
    <thead>
      <tr>
        <th>car</th>
        <th>flight</th>
        <th>dep time</th>
        <th>aircraft</th>
        <th title="This weekly service's own flights, by live T1 - real counts, not a percentage, since the sample size matters as much as the rate">open/full</th>
        <th>ignore</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <button id="addBtn" style="display:none;" onclick="addRow()">+ add flight</button>

  <div class="btnRow" style="display:none;" id="btnRow">
    <span id="status"></span>
    <span>
      <button id="copyBtn" onclick="copyToOtherDays()" title="Overwrites the other 6 days with what's currently saved for this route/day">Copy to other days</button>
      <button id="saveBtn" onclick="saveSchedule()" disabled>save</button>
    </span>
  </div>

  <script>
    var current = null; // { org, dest, dow, rows: [...] }
    var PLACEHOLDER_AIRCRAFT = ['', 'tbd'];
    var DOW_ORDER = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];

    // Tracks unsaved edits so we can confirm before they'd be silently
    // lost - either by loading a different route/day (see loadSchedule)
    // or by closing/navigating away from the tab (see beforeunload below).
    // Save clears this BEFORE its own internal reload runs, so a normal
    // save-then-refresh cycle never spuriously trips this guard.
    var isDirty = false;

    function setDirty(flag) {
      isDirty = flag;
      document.getElementById('saveBtn').disabled = !flag;
    }

    window.addEventListener('beforeunload', function (e) {
      if (!isDirty) return;
      e.preventDefault();
      e.returnValue = '';
      return '';
    });

    // "Today" here is a convenience default for the day picker, not part
    // of any cadence logic - the browser's own local day is fine for that,
    // unlike SeatLoggingDialog's Eastern-time math for eligibility.
    function todayDowAbbrev() {
      return DOW_ORDER[new Date().getDay()];
    }

    function populateDowSelect() {
      var sel = document.getElementById('dowSelect');
      var today = todayDowAbbrev();
      var todayIdx = DOW_ORDER.indexOf(today);
      for (var i = 0; i < 7; i++) {
        var day = DOW_ORDER[(todayIdx + i) % 7];
        var opt = document.createElement('option');
        opt.value = day;
        opt.textContent = day + (day === today ? ' (today)' : '');
        sel.appendChild(opt);
      }
    }
    populateDowSelect();

    // If opened with org/dest[/dow] in the URL - the case when
    // SeatLoggingDialog's route-level pencil opens this modally,
    // already knowing which route+day to show - prefill and load
    // right away. Opened plain (no query string), this is unchanged:
    // a blank picker waiting for manual entry.
    (function prefillFromQueryString() {
      var params = new URLSearchParams(window.location.search);
      var org = params.get('org');
      var dest = params.get('dest');
      var dow = params.get('dow');
      if (!org || !dest) return;
      document.getElementById('orgInput').value = org.toLowerCase();
      document.getElementById('destInput').value = dest.toLowerCase();
      if (dow) {
        var sel = document.getElementById('dowSelect');
        for (var i = 0; i < sel.options.length; i++) {
          if (sel.options[i].value === dow.toLowerCase()) { sel.selectedIndex = i; break; }
        }
      }
      loadSchedule();
    })();

    // Delegated - the tbody element persists across renderRows() calls
    // even though its innerHTML is replaced each time, so this only
    // needs attaching once. Covers every editable field in the table:
    // car/flight/dep/aircraft (input) and ignore (checkbox, via change).
    var rowsBody = document.getElementById('rows');
    rowsBody.addEventListener('input', function (e) {
      if (e.target.matches('input.car, input.flt, input.dep')) setDirty(true);
    });
    rowsBody.addEventListener('change', function (e) {
      if (e.target.matches('input.ignore')) setDirty(true);
      else if (e.target.matches('select.airc')) onAircraftChange(parseInt(e.target.getAttribute('data-i'), 10), e.target);
    });
    rowsBody.addEventListener('click', function (e) {
      var el = e.target;
      if (!el.classList) return;
      var i = parseInt(el.getAttribute('data-i'), 10);
      if (el.classList.contains('acEdit')) openAircraftForm(i, 'edit');
      else if (el.classList.contains('afCancel')) closeAircraftForm(i);
      else if (el.classList.contains('afSave')) saveAircraftForm(i);
    });
    // Click-to-select-all on the dep-time field, same trick used by the
    // seat-logging dialogue's fields: focus alone isn't enough, since the
    // mouseup that follows a click normally re-collapses the selection
    // to wherever the cursor landed - preventing that default is what
    // makes a single click (not a careful double-click/drag across the
    // hour/minute/AM-PM text) select the whole field for typing over
    // with the existing 0615a/1815p shorthand.
    rowsBody.addEventListener('focusin', function (e) {
      if (e.target.matches('input.dep')) e.target.select();
    });
    rowsBody.addEventListener('mouseup', function (e) {
      if (e.target.matches('input.dep')) e.preventDefault();
    });
    document.getElementById('durationInput').addEventListener('input', function () {
      setDirty(true);
    });

    function swapOrgDest() {
      var orgEl = document.getElementById('orgInput');
      var destEl = document.getElementById('destInput');
      var tmp = orgEl.value;
      orgEl.value = destEl.value;
      destEl.value = tmp;
    }

    function shiftDay(delta) {
      var sel = document.getElementById('dowSelect');
      sel.selectedIndex = (sel.selectedIndex + delta + sel.options.length) % sel.options.length;
      var org = document.getElementById('orgInput').value.trim();
      var dest = document.getElementById('destInput').value.trim();
      if (org && dest) loadSchedule();
    }

    function escapeHtml(text) {
      return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function findAircraft(key) {
      var lower = String(key || '').toLowerCase();
      return (current.aircraftList || []).find(function (a) { return a.key.toLowerCase() === lower; }) || null;
    }

    function formatAircraftSizes(aircraft) {
      var sizes = aircraft ? [aircraft.d1, aircraft.first, aircraft.comfortPlus, aircraft.main] : [];
      if (sizes.length === 0 || sizes.some(function (n) { return n === null || n === undefined; })) {
        return 'sizes unknown';
      }
      var parts = [];
      if (aircraft.d1 > 0) parts.push(aircraft.d1 + ' D1');
      if (aircraft.first > 0) parts.push(aircraft.first + ' 1st');
      if (aircraft.comfortPlus > 0) parts.push(aircraft.comfortPlus + ' C+');
      parts.push(aircraft.main + ' Y');
      return parts.join(' \u00b7 ') + ' = ' + aircraft.total + (aircraft.confirmed ? ' \u2713' : '');
    }

    function aircraftOptionsHtml(currentKey) {
      var currentLower = String(currentKey || '').toLowerCase();
      var found = false;
      var html = (current.aircraftList || []).map(function (a) {
        var selected = a.key.toLowerCase() === currentLower;
        if (selected) found = true;
        return '<option value="' + escapeHtml(a.key) + '"' + (selected ? ' selected' : '') + '>' +
          escapeHtml(a.key) + ' \u2014 ' + escapeHtml(a.name) + '</option>';
      }).join('');
      if (!found) {
        html = (currentKey
          ? '<option value="' + escapeHtml(currentKey) + '" selected>' + escapeHtml(currentKey) + ' (no cabin sizes yet)</option>'
          : '<option value="" selected>\u2014</option>') + html;
      }
      return html + '<option value="__new__">+ new aircraft\u2026</option>';
    }

    function aircraftCellHtml(idx, key) {
      return '<select class="airc" data-i="' + idx + '">' + aircraftOptionsHtml(key) + '</select>' +
        '<div class="acLine"><span class="acSizes" data-i="' + idx + '"></span>' +
        '<a class="acLink acEdit" data-i="' + idx + '"></a></div>';
    }

    function aircraftFormRowHtml(idx) {
      return '<td colspan="7"><div class="aircraftForm">' +
        'key <input class="afKey" size="9"> name <input class="afName" size="24"> ' +
        'D1 <input class="afSize" data-size="d1" maxlength="3"> 1st <input class="afSize" data-size="first" maxlength="3"> ' +
        'C+ <input class="afSize" data-size="comfortPlus" maxlength="3"> Y <input class="afSize" data-size="main" maxlength="3"> ' +
        '<button class="afSave" data-i="' + idx + '">Save aircraft</button> ' +
        '<a class="acLink afCancel" data-i="' + idx + '">cancel</a><span class="afStatus"></span></div></td>';
    }

    function aircraftFormRow(i) { return document.querySelector('tr.afRow[data-i="' + i + '"]'); }

    function updateAircraftLabels(i) {
      var key = current.rows[i].aircraftConfig;
      var aircraft = findAircraft(key);
      var isPlaceholder = PLACEHOLDER_AIRCRAFT.indexOf(String(key || '').toLowerCase()) !== -1;
      document.querySelector('.acSizes[data-i="' + i + '"]').textContent = isPlaceholder ? '' : formatAircraftSizes(aircraft);
      var edit = document.querySelector('.acEdit[data-i="' + i + '"]');
      edit.textContent = aircraft ? 'edit sizes' : 'add sizes';
      edit.style.display = isPlaceholder ? 'none' : '';
    }

    function refreshAircraftSelects() {
      document.querySelectorAll('select.airc').forEach(function (sel) {
        var i = parseInt(sel.getAttribute('data-i'), 10);
        sel.innerHTML = aircraftOptionsHtml(current.rows[i].aircraftConfig);
        updateAircraftLabels(i);
      });
    }

    function onAircraftChange(i, sel) {
      if (sel.value === '__new__') {
        sel.innerHTML = aircraftOptionsHtml(current.rows[i].aircraftConfig);
        openAircraftForm(i, 'new');
        return;
      }
      current.rows[i].aircraftConfig = sel.value;
      updateAircraftLabels(i);
      setDirty(true);
    }

    function openAircraftForm(i, mode) {
      var key = current.rows[i].aircraftConfig;
      var formRow = aircraftFormRow(i);
      var form = formRow.querySelector('.aircraftForm');
      var aircraft = mode === 'edit' ? findAircraft(key) : null;
      var keyInput = form.querySelector('.afKey');
      form.setAttribute('data-mode', mode);
      keyInput.value = mode === 'edit' ? String(key).toLowerCase() : '';
      keyInput.readOnly = mode === 'edit';
      form.querySelector('.afName').value = aircraft ? aircraft.name : '';
      form.querySelectorAll('.afSize').forEach(function (input) {
        var size = aircraft ? aircraft[input.getAttribute('data-size')] : null;
        input.value = (size === null || size === undefined) ? '' : size;
      });
      form.querySelector('.afStatus').textContent = '';
      formRow.style.display = '';
      (mode === 'edit' ? form.querySelector('.afName') : keyInput).focus();
    }

    function closeAircraftForm(i) {
      aircraftFormRow(i).style.display = 'none';
    }

    function saveAircraftForm(i) {
      var form = aircraftFormRow(i).querySelector('.aircraftForm');
      var mode = form.getAttribute('data-mode');
      var payload = {
        mode: mode,
        configKey: form.querySelector('.afKey').value,
        aircraft: form.querySelector('.afName').value,
        scheduleRow: null
      };
      form.querySelectorAll('.afSize').forEach(function (input) {
        payload[input.getAttribute('data-size')] = input.value;
      });
      var status = form.querySelector('.afStatus');
      status.textContent = 'Saving\u2026';
      fetch('/api/saveAircraft', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
        .then(function (res) { return res.json(); })
        .then(function (result) {
          if (result.error) throw new Error(result.error);
          current.aircraftList = result.aircraftList;
          if (mode === 'new') {
            current.rows[i].aircraftConfig = result.configKey;
            setDirty(true);
          }
          refreshAircraftSelects();
          closeAircraftForm(i);
        })
        .catch(function (err) {
          status.textContent = err.message;
        });
    }

    function loadSchedule() {
      var org = document.getElementById('orgInput').value.trim().toLowerCase();
      var dest = document.getElementById('destInput').value.trim().toLowerCase();
      if (!org || !dest) {
        alert('Enter both a from and a to airport code.');
        return;
      }
      if (isDirty && !confirm('You have unsaved changes for the currently loaded route/day. Discard them and load this instead?')) {
        return;
      }
      var dow = document.getElementById('dowSelect').value;
      var btn = document.getElementById('loadBtn');
      btn.disabled = true;
      btn.textContent = 'Loading\u2026';
      fetch('/api/getScheduleForRouteDay', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ org: org, dest: dest, dow: dow })
      })
        .then(function (res) { return res.json(); })
        .then(function (result) {
          btn.disabled = false;
          btn.textContent = 'Load';
          if (result.error) throw new Error(result.error);
          current = result;
          current.rows.forEach(function (r) { r.deleted = false; });
          renderRows();
          renderDuration();
          setDirty(false);
        })
        .catch(function (err) {
          btn.disabled = false;
          btn.textContent = 'Load';
          alert('Error: ' + err.message);
        });
    }

    function minutesToHHMM(totalMinutes) {
      if (totalMinutes === '' || totalMinutes === null || totalMinutes === undefined) return '';
      var h = Math.floor(totalMinutes / 60), m = totalMinutes % 60;
      return ('0' + h).slice(-2) + ('0' + m).slice(-2);
    }

    function parseDurationHHMM(text) {
      var raw = text.trim();
      if (raw === '') return '';
      var m = raw.match(/^(\d{1,3})(\d{2})$/);
      if (!m) return null;
      var hh = parseInt(m[1], 10), mm = parseInt(m[2], 10);
      if (mm > 59) return null;
      return hh * 60 + mm;
    }

    function renderDuration() {
      var row = document.getElementById('durationRow');
      var input = document.getElementById('durationInput');
      row.style.display = 'flex';
      input.value = minutesToHHMM(current.durationMinutes);
    }

    function renderRows() {
      var tbody = document.getElementById('rows');
      tbody.innerHTML = '';
      var visibleRows = current.rows.filter(function (r) { return !r.deleted; });

      visibleRows.forEach(function (row) {
        var idx = current.rows.indexOf(row);
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td><input class="car" data-i="' + idx + '" value="' + (row.carrier || 'dl') + '"></td>' +
          '<td><input class="flt" data-i="' + idx + '" value="' + (row.flightNumber || '') + '"></td>' +
          '<td><input class="dep" data-i="' + idx + '" value="' + (row.depDisplay || '') + '"></td>' +
          '<td>' + aircraftCellHtml(idx, row.aircraftConfig) + '</td>' +
          '<td class="ofCell">open ' + (row.openFull ? row.openFull.openDisplay : '\u2014') +
            '<br>full ' + (row.openFull ? row.openFull.fullDisplay : '\u2014') + '</td>' +
          '<td><input type="checkbox" class="ignore" data-i="' + idx + '" title="Never offer this flight for logging"' +
            (row.ignore ? ' checked' : '') + '></td>' +
          '<td><button class="delBtn" data-i="' + idx + '" onclick="deleteRow(' + idx + ')" title="delete row">\u2716</button></td>';
        tbody.appendChild(tr);
        var formTr = document.createElement('tr');
        formTr.className = 'afRow';
        formTr.setAttribute('data-i', idx);
        formTr.style.display = 'none';
        formTr.innerHTML = aircraftFormRowHtml(idx);
        tbody.appendChild(formTr);
        updateAircraftLabels(idx);
      });

      document.getElementById('schedTable').style.display = visibleRows.length > 0 ? '' : 'none';
      document.getElementById('emptyMsg').style.display = visibleRows.length === 0 ? 'block' : 'none';
      document.getElementById('addBtn').style.display = '';
      document.getElementById('btnRow').style.display = 'flex';
      document.getElementById('status').textContent = '';
    }

    function addRow() {
      current.rows.push({
        scheduleRow: null,
        carrier: 'dl',
        flightNumber: 'bogus' + String(current.nextBogusNumber).padStart(3, '0'),
        dep: null, depDisplay: '',
        aircraftConfig: '',
        ignore: false,
        deleted: false,
        // A never-yet-saved row has no observation history to pool -
        // real counts start existing once it's saved and reloaded.
        openFull: { measured: 0, openDisplay: '\u2014', fullDisplay: '\u2014' }
      });
      current.nextBogusNumber++;
      setDirty(true);
      renderRows();
    }

    function deleteRow(idx) {
      var row = current.rows[idx];
      if (row.scheduleRow) {
        row.deleted = true; // existing row - server needs to delete it on save
      } else {
        current.rows.splice(idx, 1); // never-saved row - just drop it
      }
      setDirty(true);
      renderRows();
    }

    // Accepts either "h:mm am/pm" or the faster shorthand with no colon
    // or "m" - 4 digits plus a/p, e.g. "0927a" for 9:27 am, "1815p" for
    // 6:15 pm. Returns minutes-since-midnight (matching flightSchedule's
    // depTime storage), not a 24h HHMM int.
    function parseDepTime(text) {
      var raw = text.trim().toUpperCase();

      var parts = raw.match(/^(\d{1,2}):(\d{2})\s*(A|AM|P|PM)?$/);
      if (!parts) {
        // Bare digits, no colon, no leading zero required: "522" (3
        // digits, defaults AM same as an unmarked colon time always has),
        // "522p"/"522P"/"522PM" (PM), "0522" (leading zero still fine).
        var bare = raw.match(/^(\d{3,4})\s*(A|AM|P|PM)?$/);
        if (bare) {
          var digits = bare[1];
          var hh = digits.length === 3 ? digits.slice(0, 1) : digits.slice(0, 2);
          var mm = digits.slice(-2);
          parts = [null, hh, mm, bare[2]];
        }
      }
      if (!parts) return null;
      var h = parseInt(parts[1], 10), m = parseInt(parts[2], 10), period = parts[3];
      if (m > 59) return null;
      if (period && period[0] === 'P' && h !== 12) h += 12;
      if (period && period[0] === 'A' && h === 12) h = 0;
      if (h > 23) return null;
      return h * 60 + m;
    }

    function copyToOtherDays() {
      if (!current || !current.org) return;
      var btn = document.getElementById('copyBtn');
      btn.disabled = true;
      document.getElementById('status').textContent = 'Copying\u2026';
      fetch('/api/copyToOtherDays', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ org: current.org, dest: current.dest, sourceDow: current.dow })
      })
        .then(function (res) { return res.json(); })
        .then(function (result) {
          btn.disabled = false;
          if (result.error) throw new Error(result.error);
          document.getElementById('status').textContent =
              'Copied to ' + result.copiedCount + ' row(s) across the other days.';
        })
        .catch(function (err) {
          btn.disabled = false;
          document.getElementById('status').textContent = 'Copy failed: ' + err.message;
        });
    }

    function saveSchedule() {
      var cars = document.querySelectorAll('input.car');
      var flts = document.querySelectorAll('input.flt');
      var deps = document.querySelectorAll('input.dep');
      var aircs = document.querySelectorAll('select.airc');

      var badTime = null;
      deps.forEach(function (el) {
        if (parseDepTime(el.value) === null) badTime = el;
      });
      if (badTime) {
        document.getElementById('status').textContent = 'Enter a departure time like 6:15 am or 0615a.';
        badTime.focus();
        return;
      }

      cars.forEach(function (el) {
        var i = parseInt(el.getAttribute('data-i'), 10);
        current.rows[i].carrier = el.value.trim().toLowerCase() || 'dl';
      });
      flts.forEach(function (el) {
        var i = parseInt(el.getAttribute('data-i'), 10);
        current.rows[i].flightNumber = el.value.trim();
      });
      deps.forEach(function (el) {
        var i = parseInt(el.getAttribute('data-i'), 10);
        current.rows[i].dep = parseDepTime(el.value);
      });
      aircs.forEach(function (el) {
        var i = parseInt(el.getAttribute('data-i'), 10);
        current.rows[i].aircraftConfig = el.value.trim();
      });
      document.querySelectorAll('input.ignore').forEach(function (el) {
        var i = parseInt(el.getAttribute('data-i'), 10);
        current.rows[i].ignore = el.checked;
      });

      var durationRaw = document.getElementById('durationInput').value.trim();
      var durationMinutes = parseDurationHHMM(durationRaw);
      if (durationMinutes === null) {
        document.getElementById('status').textContent = 'Enter flight time as hhmm (e.g. 0215 for 2h 15m), or leave blank.';
        document.getElementById('durationInput').focus();
        return;
      }

      postSave({
        org: current.org, dest: current.dest, dow: current.dow,
        rows: current.rows,
        durationMinutes: durationMinutes
      });
    }

    function postSave(payload) {
      var btn = document.getElementById('saveBtn');
      var status = document.getElementById('status');
      btn.disabled = true;
      status.textContent = 'Saving\u2026';

      fetch('/api/saveScheduleForRouteDay', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
        .then(function (res) { return res.json(); })
        .then(function (result) {
          btn.disabled = !isDirty;
          if (result.error) throw new Error(result.error);
          if (result.unconfirmedAirports) {
            confirmNewAirports(result.unconfirmedAirports, payload);
            return;
          }
          status.textContent = 'Saved.';
          setDirty(false);
          if (window.parent && window.parent !== window &&
              typeof window.parent.onFlightScheduleSaved === 'function') {
            window.parent.onFlightScheduleSaved();
            return;
          }
          loadSchedule();
        })
        .catch(function (err) {
          btn.disabled = !isDirty;
          status.textContent = 'Error: ' + err.message;
        });
    }

    function confirmNewAirports(airports, payload) {
      var status = document.getElementById('status');
      var unknown = airports.filter(function (a) { return !a.tz; });
      if (unknown.length) {
        status.textContent = 'Not saved - ' + unknown.map(function (a) { return a.code; }).join(', ') +
          " isn't a real airport code as far as airportsdata knows. Check the spelling.";
        return;
      }
      for (var i = 0; i < airports.length; i++) {
        var a = airports[i];
        var ok = confirm(a.code + " isn't confirmed yet. airportsdata says:\n\n" +
          a.name + ', ' + a.city + ', ' + a.country + ' (' + a.tz + ')\n\nConfirm?');
        if (!ok) {
          status.textContent = 'Not saved - ' + a.code + ' not confirmed.';
          return;
        }
      }
      airports.reduce(function (chain, a) {
        return chain.then(function () {
          return fetch('/api/confirmAirport', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: a.code })
          })
            .then(function (res) { return res.json(); })
            .then(function (result) { if (result.error) throw new Error(result.error); });
        });
      }, Promise.resolve())
        .then(function () { postSave(payload); })
        .catch(function (err) { status.textContent = 'Error: ' + err.message; });
    }
  </script>
</body>
</html>
