<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <title>nonrev tools</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    h1 { font-size: 18px; color: #222; margin-bottom: 18px; }
    .tools { display: flex; flex-direction: column; gap: 10px; max-width: 280px; }
    a.tool {
      display: block; padding: 12px 16px; background: #1a73e8; color: white;
      text-decoration: none; border-radius: 4px; font-size: 14px; text-align: center;
    }
    a.tool:hover { background: #1558b0; }
    #summary { font-size: 14px; color: #444; margin-bottom: 20px; }
    #summary .num { font-weight: bold; color: #222; }
    #refreshEstimatesBtn {
      margin-top: 16px; padding: 8px 14px; font-size: 13px; color: #444;
      background: #fff; border: 1px solid #ccc; border-radius: 4px; cursor: pointer;
    }
    #refreshEstimatesBtn:hover { background: #f2f2f2; }
    #refreshStatus { font-size: 12px; color: #666; margin-top: 6px; }
  </style>
</head>
<body>
  <h1>nonrev tools</h1>
  <div id="summary">Loading today's tally&hellip;</div>
  <div class="tools">
    <a class="tool" href="/log">Log Observations</a>
    <a class="tool" href="/schedule">Edit Schedule</a>
    <a class="tool" href="/observations">Browse Observations</a>
    <a class="tool" href="/graph">Graph Observations</a>
  </div>
  <button id="refreshEstimatesBtn" onclick="refreshFloorEstimates()">Refresh floor estimates</button>
  <div id="refreshStatus"></div>
  <script>
    fetch('/api/getLauncherSummary')
      .then(function (res) { return res.json(); })
      .then(function (r) {
        var el = document.getElementById('summary');
        if (r.error) { el.textContent = ''; return; }
        el.innerHTML =
          '<span class="num">' + r.remaining + '</span> flight' + (r.remaining === 1 ? '' : 's') +
          ' left today &middot; <span class="num">' + r.departed + '</span> already left &middot; ' +
          '<span class="num">' + r.goldenTickets + '</span> golden ticket' + (r.goldenTickets === 1 ? '' : 's') +
          ' (\u2264' + r.goldenTicketHours + 'h)';
      })
      .catch(function () {
        document.getElementById('summary').textContent = '';
      });

    function refreshFloorEstimates() {
      var btn = document.getElementById('refreshEstimatesBtn');
      var status = document.getElementById('refreshStatus');
      btn.disabled = true;
      status.textContent = 'Refreshing\u2026';
      fetch('/api/refreshFloorEstimates', { method: 'POST' })
        .then(function (res) { return res.json(); })
        .then(function (result) {
          if (result.error) throw new Error(result.error);
          var totalPairs = Object.keys(result).reduce(function (sum, cabin) {
            return sum + result[cabin];
          }, 0);
          status.textContent = 'Refreshed (' + totalPairs + ' floor/cabin pairs).';
        })
        .catch(function (err) {
          status.textContent = 'Error: ' + err.message;
        })
        .finally(function () {
          btn.disabled = false;
        });
    }
  </script>
</body>
</html>
