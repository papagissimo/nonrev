<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <title>T1 Grid Report</title>
  <style>
    body { font-family: Arial, sans-serif; font-size: 13px; margin: 10px; }
    h1 { font-size: 18px; margin: 0 0 10px 0; }
    a.back { color: #1a73e8; text-decoration: none; font-size: 12px; }
    .topBar { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
    .topBar label { color: #666; }
    #bandMinutes { width: 52px; }
    #status { color: #666; font-size: 12px; }
    .legRow { display: flex; gap: 48px; align-items: flex-start; flex-wrap: wrap; }
    .legBlock label { color: #666; display: block; margin-bottom: 8px; }
    table { border-collapse: collapse; }
    th { font-size: 11px; color: #888; padding: 4px 12px; text-align: right; white-space: nowrap; }
    th.serviceCol { text-align: left; }
    td { padding: 4px 12px; font-size: 13px; text-align: right; border-bottom: 1px solid #eee; font-variant-numeric: tabular-nums; }
    td.serviceCol { text-align: left; color: #444; }
    .warnings { color: #b06000; font-size: 12px; margin-top: 8px; }
    #chartCaption { color: #666; font-size: 12px; margin: 22px 0 6px 0; }
    #chartWrap { overflow-x: auto; }
    #legend { display: flex; align-items: center; gap: 8px; margin: 10px 0 4px 0; font-size: 12px; color: #555; }
    #legendStrip { width: 220px; height: 10px; border-radius: 2px; border: 1px solid #bbb; }
    #legendNote { color: #888; font-size: 11px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <a class="back" href="/">&larr; Launcher</a>
  <h1>T1 Grid Report</h1>

  <div class="topBar">
    <label>Day <select id="daySelect" onchange="load()"></select></label>
    <label>Connection band <input id="bandMinutes" type="number" min="0" step="5" value="60" oninput="drawChart()"> min</label>
    <span id="status"></span>
  </div>

  <div class="legRow">
    <div class="legBlock">
      <label>First leg <select id="routeSelectFirst" onchange="load()"></select></label>
      <div id="gridFirst"></div>
    </div>
    <div class="legBlock">
      <label>Second leg <select id="routeSelectSecond" onchange="load()"></select></label>
      <div id="gridSecond"></div>
    </div>
  </div>

  <div id="chartCaption"></div>
  <div id="chartWrap"></div>
  <div id="legend"></div>
  <div id="legendNote"></div>

  <script>
    const DAYS_OF_WEEK = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    const DEFAULT_DAY = 'Fri';
    const SVG_NS = 'http://www.w3.org/2000/svg';
    const PX_PER_HOUR = 48;
    const GUTTER_WIDTH = 70;
    const TOP_PAD = 44;
    const BOTTOM_PAD = 12;
    const COLUMN_WIDTH = 46;
    const COLUMN_GAP = 10;
    const PANEL_GAP = 64;
    const LABEL_LEAD_MINUTES = 22;
    const BAND_COLOR = '#b8b8b8';
    const NUMBER_ROW_PX = 13;
    const NUMBER_TOP_PAD = 6;
    const UNCOUNTED_NUMBER_OPACITY = 0.55;

    let lastChart = null;

    function cell(tag, text, className) {
      const el = document.createElement(tag);
      el.textContent = text;
      if (className) el.className = className;
      return el;
    }

    function svgEl(tag, attrs, text) {
      const el = document.createElementNS(SVG_NS, tag);
      Object.keys(attrs).forEach(function (k) { el.setAttribute(k, attrs[k]); });
      if (text !== undefined) el.textContent = text;
      return el;
    }

    function setStatus(text) {
      document.getElementById('status').textContent = text;
    }

    function routeValue(r) { return r.org + '|' + r.dest; }

    function fillRouteSelect(select, routes) {
      routes.forEach(function (r) {
        const option = document.createElement('option');
        option.value = routeValue(r);
        option.textContent = r.org.toUpperCase() + '\u2192' + r.dest.toUpperCase();
        select.appendChild(option);
      });
    }

    function fillSelects(routes) {
      const first = document.getElementById('routeSelectFirst');
      const second = document.getElementById('routeSelectSecond');
      fillRouteSelect(first, routes);
      fillRouteSelect(second, routes);
      const firstRoute = routes[0];
      const onward = routes.find(function (r) { return r.org === firstRoute.dest; });
      first.value = routeValue(firstRoute);
      second.value = routeValue(onward || routes[0]);

      const daySelect = document.getElementById('daySelect');
      DAYS_OF_WEEK.forEach(function (d) {
        const option = document.createElement('option');
        option.value = d;
        option.textContent = d;
        daySelect.appendChild(option);
      });
      daySelect.value = DEFAULT_DAY;
    }

    function selectedRoute(selectId) {
      const parts = document.getElementById(selectId).value.split('|');
      return { org: parts[0], dest: parts[1] };
    }

    function post(url, body) {
      return fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      }).then(function (res) { return res.json(); });
    }

    function renderGrid(containerId, grid) {
      const container = document.getElementById(containerId);
      container.replaceChildren();
      if (!grid.rows.length) {
        container.appendChild(cell('div', 'No readings for this route and day.', 'warnings'));
        return;
      }
      const table = document.createElement('table');
      const headerRow = document.createElement('tr');
      headerRow.appendChild(cell('th', 'service', 'serviceCol'));
      grid.dateHeaders.forEach(function (h) { headerRow.appendChild(cell('th', h)); });
      const thead = document.createElement('thead');
      thead.appendChild(headerRow);
      table.appendChild(thead);
      const tbody = document.createElement('tbody');
      grid.rows.forEach(function (row) {
        const tr = document.createElement('tr');
        tr.appendChild(cell('td', row.label, 'serviceCol'));
        row.cells.forEach(function (c) { tr.appendChild(cell('td', c ? c.display : '')); });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      container.appendChild(table);
      if (grid.warnings.length) {
        container.appendChild(cell('div', grid.warnings.join(' \u00b7 '), 'warnings'));
      }
    }

    function clockLabel(hubMinutes, offsetMinutes) {
      const minutes = (((hubMinutes + offsetMinutes) % 1440) + 1440) % 1440;
      const hh = Math.floor(minutes / 60);
      const mm = minutes % 60;
      return (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;
    }

    function panelWidth(bars) {
      return bars.length * (COLUMN_WIDTH + COLUMN_GAP) + COLUMN_GAP;
    }

    function drawWeekNumbers(group, bar, x, top, height) {
      const rowsFit = Math.floor((height - NUMBER_TOP_PAD) / NUMBER_ROW_PX);
      if (!bar.weeks.length || rowsFit < 1) return;
      const shown = bar.weeks.length <= rowsFit ? bar.weeks.length : rowsFit - 1;
      const rowY = function (i) { return top + NUMBER_TOP_PAD + (i + 1) * NUMBER_ROW_PX - 3; };
      for (let i = 0; i < shown; i++) {
        group.appendChild(svgEl('text', {
          x: x + COLUMN_WIDTH / 2, y: rowY(i), 'text-anchor': 'middle', 'font-size': 11,
          fill: bar.textColor, opacity: bar.weeks[i].counted ? 1 : UNCOUNTED_NUMBER_OPACITY,
        }, bar.weeks[i].display));
      }
      const extra = bar.weeks.length - shown;
      if (extra > 0) {
        group.appendChild(svgEl('text', {
          x: x + COLUMN_WIDTH / 2, y: rowY(shown), 'text-anchor': 'middle', 'font-size': 10,
          fill: bar.textColor, opacity: 0.8,
        }, '+' + extra));
      }
    }

    function drawLegend(legend) {
      const el = document.getElementById('legend');
      const note = document.getElementById('legendNote');
      el.replaceChildren();
      note.textContent = '';
      if (!legend) return;
      const strip = document.createElement('div');
      strip.id = 'legendStrip';
      strip.style.background = 'linear-gradient(to right, ' +
        legend.stops.map(function (s) { return s.color + ' ' + (s.offset * 100) + '%'; }).join(', ') + ')';
      el.appendChild(cell('span', legend.openLabel));
      el.appendChild(strip);
      el.appendChild(cell('span', legend.fullLabel));
      note.textContent = 'Paler = fewer than ' + legend.fewWeeksBelow + ' counted weeks. Dimmed numbers = estimate had no late reading, so it does not count toward color.';
    }

    function drawChart() {
      const caption = document.getElementById('chartCaption');
      const wrap = document.getElementById('chartWrap');
      wrap.replaceChildren();
      caption.textContent = '';
      drawLegend(null);
      if (!lastChart) return;
      if (lastChart.problem) {
        caption.textContent = lastChart.problem;
        return;
      }

      const bandMinutes = Math.max(0, Number(document.getElementById('bandMinutes').value) || 0);
      const legs = lastChart.legs;
      const axes = lastChart.axes;
      const drawable = legs.map(function (leg) { return leg.bars.length > 0; });
      const problems = legs.filter(function (leg) { return leg.problem; })
        .map(function (leg) { return leg.problem; });
      caption.textContent = 'Left axis: ' + axes.left.airport + ' local time. Right axis: ' + axes.right.airport +
        ' local time. Bar labels are each flight\u2019s departure at its own origin, rounded to 15 min \u2014 hover a bar for exact local times and the weekly numbers.' +
        (problems.length ? '  \u2014  ' + problems.join('; ') : '');

      const allBars = [];
      legs.forEach(function (leg, i) {
        leg.bars.forEach(function (b) {
          allBars.push({ start: b.startMinutes, end: b.endMinutes + (i === 0 ? bandMinutes : 0) });
        });
      });
      if (!allBars.length) return;

      const axisStart = Math.floor((Math.min.apply(null, allBars.map(function (b) { return b.start; })) - LABEL_LEAD_MINUTES) / 60) * 60;
      const axisEnd = Math.ceil(Math.max.apply(null, allBars.map(function (b) { return b.end; })) / 60) * 60;
      const y = function (minutes) { return TOP_PAD + (minutes - axisStart) / 60 * PX_PER_HOUR; };

      const firstWidth = panelWidth(legs[0].bars);
      const secondWidth = panelWidth(legs[1].bars);
      const firstX = GUTTER_WIDTH;
      const secondX = firstX + firstWidth + PANEL_GAP;
      const rightEdge = secondX + secondWidth;
      const totalWidth = rightEdge + GUTTER_WIDTH;
      const totalHeight = y(axisEnd) + BOTTOM_PAD;

      const svg = svgEl('svg', { width: totalWidth, height: totalHeight, 'font-family': 'Arial, sans-serif' });

      [[firstX, firstWidth, 0], [secondX, secondWidth, 1]].forEach(function (p) {
        if (!drawable[p[2]]) return;
        svg.appendChild(svgEl('rect', { x: p[0], y: TOP_PAD, width: p[1], height: y(axisEnd) - TOP_PAD, fill: '#f6f6f6' }));
        svg.appendChild(svgEl('text', {
          x: p[0] + p[1] / 2, y: 20, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 'bold', fill: '#333',
        }, legs[p[2]].route));
      });

      [[axes.left, firstX - 8, 'end'], [axes.right, rightEdge + 8, 'start']].forEach(function (a) {
        svg.appendChild(svgEl('text', { x: a[1], y: TOP_PAD - 20, 'text-anchor': a[2], 'font-size': 10, fill: '#777' }, a[0].airport + ' time'));
        svg.appendChild(svgEl('text', { x: a[1], y: TOP_PAD - 8, 'text-anchor': a[2], 'font-size': 10, fill: '#999' }, '(' + a[0].zone + ')'));
      });

      for (let m = axisStart; m <= axisEnd; m += 60) {
        svg.appendChild(svgEl('line', { x1: GUTTER_WIDTH - 4, x2: rightEdge + 4, y1: y(m), y2: y(m), stroke: '#ddd', 'stroke-width': 1 }));
        svg.appendChild(svgEl('text', { x: firstX - 8, y: y(m) + 4, 'text-anchor': 'end', 'font-size': 11, fill: '#777' }, clockLabel(m, axes.left.offsetMinutes)));
        svg.appendChild(svgEl('text', { x: rightEdge + 8, y: y(m) + 4, 'text-anchor': 'start', 'font-size': 11, fill: '#777' }, clockLabel(m, axes.right.offsetMinutes)));
      }

      if (drawable[0]) {
        legs[0].bars.forEach(function (b) {
          svg.appendChild(svgEl('line', {
            x1: firstX, x2: rightEdge, y1: y(b.endMinutes + bandMinutes), y2: y(b.endMinutes + bandMinutes),
            stroke: '#888', 'stroke-width': 1, 'stroke-dasharray': '3,3', opacity: 0.55,
          }));
        });
      }

      legs.forEach(function (leg, i) {
        const panelX = i === 0 ? firstX : secondX;
        leg.bars.forEach(function (b, j) {
          const x = panelX + COLUMN_GAP + j * (COLUMN_WIDTH + COLUMN_GAP);
          const top = y(b.startMinutes);
          const barHeight = y(b.endMinutes) - top;
          const group = svgEl('g', {});
          group.appendChild(svgEl('title', {}, b.tooltip));
          group.appendChild(svgEl('rect', {
            x: x, y: top, width: COLUMN_WIDTH, height: barHeight, fill: b.fill, rx: 2,
            stroke: '#444', 'stroke-width': 0.8, 'stroke-opacity': 0.45,
          }));
          group.appendChild(svgEl('text', { x: x + COLUMN_WIDTH / 2, y: top - 5, 'text-anchor': 'middle', 'font-size': 11, fill: '#333' }, b.label));
          drawWeekNumbers(group, b, x, top, barHeight);
          if (i === 0) {
            group.appendChild(svgEl('rect', {
              x: x, y: y(b.endMinutes), width: COLUMN_WIDTH, height: bandMinutes / 60 * PX_PER_HOUR, fill: BAND_COLOR, rx: 2,
            }));
          }
          svg.appendChild(group);
        });
      });

      wrap.appendChild(svg);
      drawLegend(lastChart.legend);
    }

    function load() {
      const first = selectedRoute('routeSelectFirst');
      const second = selectedRoute('routeSelectSecond');
      const dayOfWeek = document.getElementById('daySelect').value;
      setStatus('Loading\u2026');
      Promise.all([
        post('/api/getT1Grid', { org: first.org, dest: first.dest, dayOfWeek: dayOfWeek }),
        post('/api/getT1Grid', { org: second.org, dest: second.dest, dayOfWeek: dayOfWeek }),
        post('/api/getConnectionChart', {
          firstOrg: first.org, firstDest: first.dest, secondOrg: second.org, secondDest: second.dest, dayOfWeek: dayOfWeek,
        }),
      ])
        .then(function (results) {
          const failed = results.find(function (r) { return r.error; });
          if (failed) { setStatus('Error: ' + failed.error); return; }
          renderGrid('gridFirst', results[0]);
          renderGrid('gridSecond', results[1]);
          lastChart = results[2];
          drawChart();
          setStatus('');
        })
        .catch(function (err) { setStatus('Error: ' + err); });
    }

    fetch('/api/getT1GridRoutes')
      .then(function (res) { return res.json(); })
      .then(function (r) {
        if (r.error) { setStatus('Error: ' + r.error); return; }
        fillSelects(r.routes);
        load();
      })
      .catch(function (err) { setStatus('Error: ' + err); });
  </script>
</body>
</html>
