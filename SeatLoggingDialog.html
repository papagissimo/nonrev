<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: Arial, sans-serif; font-size: 16px; margin: 10px; }
    .subhead { margin-bottom: 2px; display: flex; align-items: baseline; }
    .routeTitle { font-size: 27px; font-weight: bold; color: #222; }
    .dateSub { font-size: 16px; color: #666; margin-left: 10px; }
    .summary { color: #888; font-size: 13px; margin-left: 10px; }
    .wait { color: #1a73e8; font-size: 17px; margin: 14px 0; }
    table { border-collapse: collapse; width: 100%; table-layout: fixed; }
    th { text-align: left; font-size: 13px; color: #888; padding: 3px 5px; overflow: hidden; }
    td { padding: 5px 5px; vertical-align: middle; overflow: hidden; }
    tr.next { background: #e6f4ea; }
    .dep { font-weight: bold; font-size: 17px; }
    .hrs { font-size: 15px; color: #666; }
    .hrs.soon { color: #c5221f; font-weight: bold; }
    input.seat { width: 38px; font-size: 16px; text-align: center; box-sizing: border-box; }
    input.timeEdit, input.aircEdit, input.fltEdit { font-size: 14px; display: none; width: 100%; box-sizing: border-box; }
    label.ignoreEdit { font-size: 12px; color: #666; display: none; white-space: nowrap; }
    .flt { font-size: 14px; color: #666; }
    .pencil { cursor: pointer; color: #888; font-size: 16px; }
    .prev { font-size: 15px; font-weight: bold; color: #555; line-height: 1.4; }
    .prev .row { white-space: nowrap; }
    .prevHrsInline { display: inline-block; width: 38px; color: #666; }
    .prevHrsInline.mostRecent { color: #c5221f; }
    td.col-flt { padding-right: 2px; }
    td.col-flag { padding-left: 2px; }
    .flagCell input { font-size: 15px; width: 100%; box-sizing: border-box; border: 1px solid #ddd; border-radius: 3px; padding: 5px 7px; }
    #routeFlagRow { margin: 4px 0 8px; }
    #routeFlagRow input { font-size: 14px; width: 100%; box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px; padding: 5px 8px; color: #555; }
    #routeFlagRow input::placeholder { color: #aaa; }
    .btnRow { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
    #getNextBtn, #logBtn { background: #1a73e8; color: white; border: none; border-radius: 4px; padding: 10px 18px; font-size: 16px; cursor: pointer; }
    #getNextBtn:disabled, #logBtn:disabled { background: #a9c6f2; }
    #status { color: #666; font-size: 14px; }
    #startState { text-align: center; padding: 40px 0; }
    .settingsLink { text-align: right; font-size: 13px; margin-bottom: 4px; }
    .settingsLink a { color: #1a73e8; cursor: pointer; text-decoration: none; }
    #settingsPanel { display: none; border: 1px solid #ddd; border-radius: 4px; padding: 10px; margin-bottom: 10px; font-size: 13px; background: #fafafa; }
    #settingsPanel .tierRow { margin-top: 8px; }
    #settingsPanel input[type=number] { width: 46px; text-align: center; }
    #settingsPanel label { display: block; margin-bottom: 4px; }
    #saveSettingsBtn { margin-top: 10px; background: #1a73e8; color: white; border: none; border-radius: 4px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
    #recentPanel { font-size: 15px; color: #888; margin-top: 10px; }
    .recentRow { line-height: 1.3; white-space: pre; font-family: 'Courier New', monospace; }
    .recentRow.cur { color: #333; }
  </style>
</head>
<body>
  <div id="startState">
    <button id="getNextBtn" onclick="loadBatch()">Get Next Flights</button>
  </div>

  <div id="batchView" style="display:none;">
    <div class="settingsLink"><a onclick="toggleSettings()">Settings</a></div>
    <div id="settingsPanel">
      <label><input type="checkbox" id="setLogEverything"> Log every flight regardless of timing (ignores tiers below)</label>
      <div class="tierRow">
        <b>Near tier</b> - always runs to the 45-min cutoff, no "done for the day"<br>
        Due within <input type="number" step="0.1" id="setNearMax"> h &middot;
        recheck every <input type="number" step="0.1" id="setNearGap"> h
      </div>
      <div class="tierRow">
        <b>Far tier</b> - closes for the day once a close-enough reading lands<br>
        Due between <input type="number" step="0.1" id="setFarMin"> and <input type="number" step="0.1" id="setFarMax"> h &middot;
        target <input type="number" step="0.1" id="setFarTarget"> h<br>
        done once within <input type="number" step="0.1" id="setFarTol"> h of target &middot;
        else recheck every <input type="number" step="0.1" id="setFarGap"> h
      </div>
      <button id="saveSettingsBtn" onclick="saveSettings()">Save Settings</button>
      <span id="settingsStatus" style="margin-left:8px; color:#666;"></span>
    </div>
    <div class="subhead">
      <span class="routeTitle" id="routeTitle"></span><span class="dateSub" id="dateSub"></span><span class="summary" id="summary"></span>
    </div>
    <div id="routeFlagRow">
      <input type="text" id="routeFlagInput" placeholder="Flag this route today (e.g. wide open all day, looks off)…">
    </div>
    <div class="wait" id="wait" style="display:none;"></div>
    <table id="flightTable" style="display:none;">
      <colgroup id="colgroup"></colgroup>
      <thead><tr id="headerRow"></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <datalist id="aircraftOptions"></datalist>
    <div class="btnRow" id="btnRow" style="display:none;">
      <span id="status">Blank rows aren't logged.</span>
      <button id="logBtn" onclick="logReadings()">Log these readings</button>
    </div>
    <div id="recentPanel"></div>
  </div>

  <script>
    var initData = {}; // aircraftOptions now arrives on the batch result itself, see renderAircraftOptions
    var batch = null;
    var SEAT_FIELDS = ['y', 'cplus', 'onePS', 'd1'];
    var aircraftOptionsRendered = false;
    var skippedRouteKeys = [];

    // Session-scoped only (resets on page reload) - just-logged entries,
    // most recent last. Rendered as a plain static "current + last 2"
    // list, no auto-scroll/animation - his call, keeps it simple. Seeded
    // once from real db history on first load (see renderBatch) since it
    // otherwise starts with no memory of anything before this page load.
    var recentlyLogged = [];
    var recentSeeded = false;

    function formatHours(h) {
      // Below 10h, precision to a tenth still matters. At 10h+ it
      // doesn't - his call ("no difference between 10.3 and 11.6") -
      // so just round to a whole number past that point. One shared
      // function so every place hours get shown (current Hrs, Prev,
      // the recent-readings panel) follows the same rule.
      if (h === null || h === undefined || h === '') return '--';
      var n = Number(h);
      if (Math.abs(n) >= 10) return Math.round(n) + 'h';
      return n.toFixed(1) + 'h';
    }

    function padRight(s, len) {
      s = String(s);
      return s.length >= len ? s : s + ' '.repeat(len - s.length);
    }

    function renderRecentPanel() {
      var el = document.getElementById('recentPanel');
      if (recentlyLogged.length === 0) { el.innerHTML = ''; return; }
      var toShow = recentlyLogged.slice(-9).reverse(); // most recent first
      function fmt(v) {
        return (v === '' || v === null || v === undefined) ? '-' : v;
      }
      var anyD1 = toShow.some(function (r) {
        return r.d1 !== '' && r.d1 !== null && r.d1 !== undefined;
      });
      var rowsHtml = toShow.map(function (r, idx) {
        var cls = idx === 0 ? 'cur' : '';
        // Monospace + fixed-width padding (not a table) - this is what
        // actually gets both things he wants at once: real column
        // alignment (org/dest/hrs land at the same x every row) AND
        // tight spacing (no cell padding bloat between them, and none
        // within the seat-count tuple either).
        var tuple = [fmt(r.y), fmt(r.cplus), fmt(r.onePS)];
        if (anyD1) tuple.push(fmt(r.d1));
        var line = padRight(r.org, 4) + padRight(r.dest, 4) +
          padRight(formatHours(r.hrs), 6) + tuple.join(' ');
        return '<div class="recentRow ' + cls + '">' + line + '</div>';
      }).join('');
      el.innerHTML = rowsHtml;
    }

    function buildColumns(anyD1) {
      var cols = [
        { key: 'dep', label: 'Dep', width: 92 },
        { key: 'y', label: 'Y', width: 48 },
        { key: 'cplus', label: 'C+', width: 48 },
        { key: 'onePS', label: '1/PS', width: 48 }
      ];
      if (anyD1) cols.push({ key: 'd1', label: 'D1', width: 48 });
      // Hrs sits right next to the seat-input columns (the current
      // reading), with Prev pushed past a small gap - his call, so the
      // "what I'm about to log" block reads as one unit. Hrs/Prev
      // columns themselves stay put - only the padding/gap around them
      // shrank (twice now, per his feedback), to give the Flag column
      // (below) more room.
      cols.push({ key: 'hrs', label: 'Hrs', width: 60 });
      cols.push({ key: 'gap', label: '', width: 8 });
      cols.push({ key: 'prev', label: 'Prev', width: 104 });
      cols.push({ key: 'flt', label: 'Flight', width: 70 });
      cols.push({ key: 'flag', label: 'Flag', width: 296 });
      // Car dropped from view entirely (no edit affordance). Aircraft
      // stays hidden UNTIL a row is toggled into edit mode via the
      // pencil - unlike Car, it's a real editable field (see toggleEdit),
      // just never shown as a read-only display the rest of the time.
      cols.push({ key: 'airc', label: '', width: 70 });
      cols.push({ key: 'ignoreEdit', label: '', width: 76 });
      cols.push({ key: 'pencil', label: '', width: 30 });
      return cols;
    }

    function formatPreviousReadings(anyD1, readings) {
      // Most-recent-first (backend sorts by hoursBeforeDep ascending -
      // smaller hours-before-departure means the check happened later).
      // Each row carries its own hrs value inline so it's never
      // ambiguous which reading a given hours-before-dep belongs to.
      // The most recent one (index 0) is highlighted - his call, since
      // that's the number he's actually comparing the live Hrs column
      // against, over and over, while working a route.
      if (!readings || readings.length === 0) return '';
      return readings.map(function (rd, idx) {
        var parts = [rd.y, rd.cplus, rd.onePS];
        if (anyD1) parts.push(rd.d1);
        var text = parts.map(function (v) {
          return (v === '' || v === null || v === undefined) ? '-' : v;
        }).join(' ');
        var hrsText = formatHours(rd.hrs);
        var hrsClass = 'prevHrsInline' + (idx === 0 ? ' mostRecent' : '');
        return '<div class="row"><span class="' + hrsClass + '">' + hrsText + '</span> ' + text + '</div>';
      }).join('');
    }

    function renderAircraftOptions(options) {
      if (aircraftOptionsRendered) return;
      var dl = document.getElementById('aircraftOptions');
      (options || []).forEach(function (opt) {
        var o = document.createElement('option');
        o.value = opt;
        dl.appendChild(o);
      });
      aircraftOptionsRendered = true;
    }

    function toggleSettings() {
      var panel = document.getElementById('settingsPanel');
      panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    function populateSettingsForm(settings) {
      document.getElementById('setLogEverything').checked = !!settings.logEverything;
      var near = settings.tiers[0], far = settings.tiers[1];
      document.getElementById('setNearMax').value = near.maxHours;
      document.getElementById('setNearGap').value = near.recheckGapHours;
      document.getElementById('setFarMin').value = far.minHours;
      document.getElementById('setFarMax').value = far.maxHours;
      document.getElementById('setFarTarget').value = far.targetHours;
      document.getElementById('setFarTol').value = far.doneToleranceHours;
      document.getElementById('setFarGap').value = far.recheckGapHours;
    }

    function saveSettings() {
      var settings = {
        logEverything: document.getElementById('setLogEverything').checked,
        tiers: [
          {
            minHours: 0,
            maxHours: parseFloat(document.getElementById('setNearMax').value),
            recheckGapHours: parseFloat(document.getElementById('setNearGap').value)
          },
          {
            minHours: parseFloat(document.getElementById('setFarMin').value),
            maxHours: parseFloat(document.getElementById('setFarMax').value),
            targetHours: parseFloat(document.getElementById('setFarTarget').value),
            doneToleranceHours: parseFloat(document.getElementById('setFarTol').value),
            recheckGapHours: parseFloat(document.getElementById('setFarGap').value)
          }
        ]
      };
      var status = document.getElementById('settingsStatus');
      status.textContent = 'Saving\u2026';
      fetch('/api/saveSettings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(settings)
      })
        .then(function (res) { return res.json(); })
        .then(function (result) {
          if (result.error) throw new Error(result.error);
          status.textContent = 'Saved.';
          loadBatch();
        })
        .catch(function (err) {
          status.textContent = 'Error: ' + err.message;
        });
    }

    function loadBatch() {
      var btn = document.getElementById('getNextBtn');
      btn.disabled = true;
      btn.textContent = 'Loading\u2026';
      fetch('/api/getNextBatch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ skipRouteKeys: skippedRouteKeys })
      })
        .then(function (res) { return res.json(); })
        .then(function (result) {
          if (result.error) throw new Error(result.error);
          document.getElementById('startState').style.display = 'none';
          document.getElementById('batchView').style.display = 'block';
          renderBatch(result);
        })
        .catch(function (err) {
          btn.disabled = false;
          btn.textContent = 'Get Next Flights';
          alert('Error: ' + err.message);
        });
    }

    function renderBatch(result) {
      batch = result;
      renderAircraftOptions(initData.aircraftOptions || result.aircraftOptions);
      if (batch.settings) populateSettingsForm(batch.settings);

      // Seed the recent-readings panel from real logged history exactly
      // once, on the very first batch this page load ever sees - after
      // that, it's purely built up from what's actually logged in this
      // session (recordRecentlyLogged), so it isn't clobbered by a fresh
      // db read every time a route gets skipped/reloaded.
      if (!recentSeeded) {
        recentSeeded = true;
        if (recentlyLogged.length === 0 && result.recentObservations) {
          recentlyLogged = result.recentObservations;
        }
      }
      renderRecentPanel();

      document.getElementById('dateSub').textContent = batch.dowDisplay + ', ' + batch.dateDisplay;

      var waitEl = document.getElementById('wait');
      var table = document.getElementById('flightTable');
      var btnRow = document.getElementById('btnRow');

      if (!batch.routeOrg) {
        document.getElementById('routeTitle').textContent = 'Nothing due right now';
        document.getElementById('summary').textContent = batch.summaryText || '';
        waitEl.style.display = 'block';
        waitEl.textContent = batch.waitMessage || 'Nothing left to check today.';
        table.style.display = 'none';
        btnRow.style.display = 'none';
        return;
      }

      document.getElementById('routeTitle').textContent = batch.routeOrg + ' \u2192 ' + batch.routeDest;
      document.getElementById('summary').textContent = batch.summaryText || '';
      document.getElementById('routeFlagInput').value = batch.routeFlag || '';
      waitEl.style.display = 'none';
      table.style.display = '';
      btnRow.style.display = 'flex';

      var anyD1 = batch.rows.some(function (r) { return r.hasD1; });
      var columns = buildColumns(anyD1);

      var colgroup = document.getElementById('colgroup');
      colgroup.innerHTML = columns.map(function (c) {
        return '<col style="width:' + c.width + 'px;">';
      }).join('');

      var headerRow = document.getElementById('headerRow');
      headerRow.innerHTML = columns.map(function (c) {
        return '<th>' + c.label + '</th>';
      }).join('');

      var tbody = document.getElementById('rows');
      tbody.innerHTML = '';
      batch.rows.forEach(function (row, i) {
        var tr = document.createElement('tr');
        if (row.isNext) tr.className = 'next';
        var hrsClass = 'hrs' + (row.hoursUntilDep <= 2 ? ' soon' : '');

        var cellHtml = {
          dep:
            '<span class="dep" data-i="' + i + '" id="depDisplay' + i + '">' + row.depDisplay + '</span>' +
            '<input class="timeEdit" data-i="' + i + '" id="depEdit' + i + '" value="' + row.depDisplay + '">',
          y: '<input class="seat" data-i="' + i + '" data-field="y" placeholder="-" maxlength="1" inputmode="numeric">',
          cplus: '<input class="seat" data-i="' + i + '" data-field="cplus" placeholder="-" maxlength="1" inputmode="numeric">',
          onePS: '<input class="seat" data-i="' + i + '" data-field="onePS" placeholder="-" maxlength="1" inputmode="numeric">',
          d1: '<input class="seat" data-i="' + i + '" data-field="d1" placeholder="-" maxlength="1" inputmode="numeric">',
          prev: '<div class="prev">' + formatPreviousReadings(anyD1, row.previousReadings) + '</div>',
          hrs: '<span class="' + hrsClass + '">' + formatHours(row.hoursUntilDep) + '</span>',
          gap: '',
          flt:
            '<span class="flt" data-i="' + i + '" id="fltDisplay' + i + '">' + row.flightNumber + '</span>' +
            '<input class="fltEdit" data-i="' + i + '" id="fltEdit' + i + '" value="' + row.flightNumber + '">',
          flag: '<span class="flagCell"><input type="text" data-i="' + i + '" id="flagInput' + i +
            '" value="' + (row.flag || '').replace(/"/g, '&quot;') + '" placeholder="\u2014"></span>',
          airc:
            '<input class="aircEdit" list="aircraftOptions" data-i="' + i + '" id="aircEdit' + i + '" value="' + row.aircraftConfig + '">',
          ignoreEdit:
            '<label class="ignoreEdit" data-i="' + i + '" id="ignoreEdit' + i + '">' +
              '<input type="checkbox" id="ignoreChk' + i + '"> ignore</label>',
          pencil: '<span class="pencil" data-i="' + i + '" onclick="toggleEdit(' + i + ')" title="edit schedule">\u270e</span>'
        };

        tr.innerHTML = columns.map(function (c) {
          return '<td class="col-' + c.key + '">' + (cellHtml[c.key] || '') + '</td>';
        }).join('');
        tbody.appendChild(tr);

        var flagInput = tr.querySelector('#flagInput' + i);
        if (flagInput) {
          flagInput.addEventListener('blur', function () {
            saveFlightDayFlag(row, flagInput.value);
          });
        }
      });

      tbody.removeEventListener('keydown', handleArrowNav);
      tbody.addEventListener('keydown', handleArrowNav);
      tbody.removeEventListener('input', sanitizeSeatInput);
      tbody.addEventListener('input', sanitizeSeatInput);
    }

    function sanitizeSeatInput(e) {
      // Hard block at the source - the whole reason a stray "65" ever
      // got into observations. A single digit 0-9, nothing else, no
      // matter how it got typed or pasted in.
      var el = e.target;
      if (!el.classList || !el.classList.contains('seat')) return;
      var cleaned = el.value.replace(/[^0-9]/g, '').slice(0, 1);
      if (cleaned !== el.value) el.value = cleaned;
    }

    function handleArrowNav(e) {
      var key = e.key;
      if (key !== 'ArrowUp' && key !== 'ArrowDown' && key !== 'ArrowLeft' && key !== 'ArrowRight') return;
      var el = e.target;
      if (!el.classList || !el.classList.contains('seat')) return;

      var i = parseInt(el.getAttribute('data-i'), 10);
      var field = el.getAttribute('data-field');
      var fieldIdx = SEAT_FIELDS.indexOf(field);
      var target = null;

      if (key === 'ArrowLeft' || key === 'ArrowRight') {
        var dir = key === 'ArrowLeft' ? -1 : 1;
        var idx = fieldIdx + dir;
        while (idx >= 0 && idx < SEAT_FIELDS.length) {
          var candidate = document.querySelector('input[data-field="' + SEAT_FIELDS[idx] + '"][data-i="' + i + '"]');
          if (candidate) { target = candidate; break; }
          idx += dir;
        }
      } else {
        var rowDir = key === 'ArrowUp' ? -1 : 1;
        var targetRow = i + rowDir;
        if (targetRow >= 0 && targetRow < batch.rows.length) {
          target = document.querySelector('input[data-field="' + field + '"][data-i="' + targetRow + '"]');
        }
      }

      if (target) {
        e.preventDefault();
        target.focus();
        target.select();
      }
    }

    function toggleEdit(i) {
      var display = document.getElementById('depDisplay' + i);
      var edit = document.getElementById('depEdit' + i);
      var aEdit = document.getElementById('aircEdit' + i);
      var fDisplay = document.getElementById('fltDisplay' + i);
      var fEdit = document.getElementById('fltEdit' + i);
      var iEdit = document.getElementById('ignoreEdit' + i);
      var editing = edit.style.display === 'inline-block';
      display.style.display = editing ? 'inline' : 'none';
      edit.style.display = editing ? 'none' : 'inline-block';
      aEdit.style.display = editing ? 'none' : 'inline-block';
      fDisplay.style.display = editing ? 'inline' : 'none';
      fEdit.style.display = editing ? 'none' : 'inline-block';
      iEdit.style.display = editing ? 'none' : 'inline-block';
      batch.rows[i].scheduleEdited = !editing;
    }

    function logReadings() {
      var btn = document.getElementById('logBtn');
      var status = document.getElementById('status');
      btn.disabled = true;
      status.textContent = 'Logging\u2026';

      var entries = batch.rows.map(function (row, i) {
        var dep = row.dep, aircraftConfig = row.aircraftConfig, flightNumber = row.flightNumber;
        var scheduleEdited = !!row.scheduleEdited;
        if (scheduleEdited) {
          var timeText = document.getElementById('depEdit' + i).value;
          aircraftConfig = document.getElementById('aircEdit' + i).value;
          flightNumber = document.getElementById('fltEdit' + i).value;
          // Accepts "6:46", "6:46 PM" (colon form) as before, and now also
          // bare digits with no colon and no leading zero required: "646"
          // (defaults AM, same as an unmarked colon time always has),
          // "646p"/"646P"/"646PM" (PM), "0646" (leading zero still fine).
          var parts = timeText.trim().toUpperCase().match(/^(\d{1,2}):(\d{2})\s*(A|AM|P|PM)?$/);
          if (!parts) {
            var bare = timeText.trim().toUpperCase().match(/^(\d{3,4})\s*(A|AM|P|PM)?$/);
            if (bare) {
              var digits = bare[1];
              var hh = digits.length === 3 ? digits.slice(0, 1) : digits.slice(0, 2);
              var mm = digits.slice(-2);
              parts = [null, hh, mm, bare[2]];
            }
          }
          if (parts) {
            var h = parseInt(parts[1], 10), m = parseInt(parts[2], 10), period = parts[3];
            if (period && period[0] === 'P' && h !== 12) h += 12;
            if (period && period[0] === 'A' && h === 12) h = 0;
            dep = h * 60 + m;
          }
        }
        function val(field) {
          var el = document.querySelector('input[data-field="' + field + '"][data-i="' + i + '"]');
          return el ? el.value.trim() : '';
        }
        var ignoreChk = document.getElementById('ignoreChk' + i);
        return {
          scheduleRow: row.scheduleRow, org: row.org, dest: row.dest, car: row.car,
          dep: dep, aircraftConfig: aircraftConfig, flightNumber: flightNumber,
          scheduleEdited: scheduleEdited, ignore: ignoreChk ? ignoreChk.checked : false,
          y: val('y'), cplus: val('cplus'), onePS: val('onePS'), d1: val('d1'),
          hoursUntilDep: row.hoursUntilDep
        };
      });

      var hasAnyData = entries.some(function (e) {
        return e.scheduleEdited || e.y !== '' || e.cplus !== '' || e.onePS !== '' || e.d1 !== '';
      });

      var loggedEntries = entries.filter(function (e) {
        return e.y !== '' || e.cplus !== '' || e.onePS !== '' || e.d1 !== '';
      });
      function recordRecentlyLogged() {
        loggedEntries.forEach(function (e) {
          recentlyLogged.push({
            org: e.org, dest: e.dest, hrs: e.hoursUntilDep,
            y: e.y, cplus: e.cplus, onePS: e.onePS, d1: e.d1
          });
        });
        if (recentlyLogged.length > 9) recentlyLogged = recentlyLogged.slice(-9);
        renderRecentPanel();
      }

      if (!hasAnyData) {
        var key = batch.routeOrg + '|' + batch.routeDest;
        if (skippedRouteKeys.indexOf(key) === -1) skippedRouteKeys.push(key);
        status.textContent = 'Skipped. Getting next\u2026';
        fetch('/api/getNextBatch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ skipRouteKeys: skippedRouteKeys })
        })
          .then(function (res) { return res.json(); })
          .then(function (nextResult) {
            if (nextResult.error) throw new Error(nextResult.error);
            btn.disabled = false;
            status.textContent = 'Blank rows aren\u2019t logged.';
            renderBatch(nextResult);
          })
          .catch(function (err) {
            btn.disabled = false;
            status.textContent = 'Error: ' + err.message;
          });
        return;
      }

      fetch('/api/saveAndGetNextBatch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          payload: { flightDate: batch.flightDate, entries: entries },
          skipRouteKeys: skippedRouteKeys
        })
      })
        .then(function (res) { return res.json(); })
        .then(function (result) {
          if (result.error) throw new Error(result.error);
          btn.disabled = false;
          status.textContent = 'Blank rows aren\u2019t logged.';
          recordRecentlyLogged();
          renderBatch(result.next);
        })
        .catch(function (err) {
          btn.disabled = false;
          status.textContent = 'Error: ' + err.message;
        });
    }

    function saveFlightDayFlag(row, flagText) {
      fetch('/api/saveFlightDayFlag', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          carrier: row.car, flightNumber: row.flightNumber, org: row.org, dest: row.dest,
          flightDate: batch.flightDate, flag: flagText
        })
      }).then(function (res) { return res.json(); })
        .then(function (result) { if (result.error) console.error(result.error); })
        .catch(function (err) { console.error(err); });
    }

    function saveRouteDayFlag(flagText) {
      if (!batch || !batch.routeOrg) return;
      fetch('/api/saveRouteDayFlag', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          carrier: batch.carrier, org: batch.routeOrg, dest: batch.routeDest,
          flightDate: batch.flightDate, flag: flagText
        })
      }).then(function (res) { return res.json(); })
        .then(function (result) { if (result.error) console.error(result.error); })
        .catch(function (err) { console.error(err); });
    }

    document.getElementById('routeFlagInput').addEventListener('blur', function (e) {
      saveRouteDayFlag(e.target.value);
    });

    loadBatch();
  </script>
</body>
</html>
